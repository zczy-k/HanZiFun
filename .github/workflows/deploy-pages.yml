name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:ci

      - name: Purge jsDelivr CDN cache
        continue-on-error: true
        run: |
          curl -sS -o /dev/null --max-time 15 \
            "https://purge.jsdelivr.net/gh/zczy-k/HanZiFun@main" || true
          echo "Purged jsDelivr cache for @main"
